  <title id="vt">MacShot vertical lockup</title>
  <desc id="vd">Mark above, wordmark below. Mark geometry mirrors macshot-icon.svg; wordmark is live text and must be outlined before production use.</desc>
  <defs>
    <style>
      .field { fill: #1D1D1F; }
