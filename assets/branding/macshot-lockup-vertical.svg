      .head { fill: #E83347; }
      .word { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; font-size: 76px; font-weight: 600; letter-spacing: -1.6px; fill: #1D1D1F; }
    </style>
  </defs>
  <g transform="translate(60 24) scale(0.23438)">
