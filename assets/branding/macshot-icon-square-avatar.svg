<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="at ad">
  <title id="at">MacShot square avatar</title>
  <desc id="ad">Full-bleed ink square with the lifted-selection mark, for social profiles and OG images.</desc>
  <defs>
    <style>
      .field { fill: #1D1D1F; }
      .screen { fill: #0A84FF; }
      .notch { fill: #0663C4; }
      .tile { fill: #FFFFFF; }
      .shaft { fill: none; stroke: #E83347; stroke-width: 40; stroke-linecap: round; }
      .head { fill: #E83347; }
    </style>
  </defs>
  <rect class="field" width="1024" height="1024"/>
  <g transform="translate(512 512) scale(1.1) translate(-512 -512)">
    <rect class="screen" x="188" y="352" width="648" height="424" rx="28"/>
    <rect class="notch" x="452" y="404" width="340" height="272" rx="16"/>
    <rect class="tile" x="412" y="284" width="340" height="272" rx="16"/>
    <path class="head" d="M684 346 651 451 574 344 Z"/>
    <path class="shaft" d="M470 500 613 397"/>
  </g>
</svg>
